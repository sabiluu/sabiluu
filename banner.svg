<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 320" width="100%" height="100%">
  <defs>
    <!-- Gradasi Langit Malam -->
    <linearGradient id="nightSky" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#040612" />
      <stop offset="50%" stop-color="#0c122c" />
      <stop offset="100%" stop-color="#191733" />
    </linearGradient>

    <radialGradient id="moonGlow" cx="85%" cy="28%" r="42%">
      <stop offset="0%" stop-color="#818cf8" stop-opacity="0.22" />
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="moonSurface" cx="35%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#fffbea" />
      <stop offset="100%" stop-color="#d8cda9" />
    </radialGradient>

    <radialGradient id="nebula" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#7c3aed" stop-opacity="0.14" />
      <stop offset="100%" stop-color="#7c3aed" stop-opacity="0" />
    </radialGradient>

    <clipPath id="moonCrescent">
      <path d="M860,65 C888,65 915,88 915,116 C915,144 892,167 864,167 C850,167 838,161 829,153 C852,146 867,125 867,102 C867,88 860,75 860,65 Z" />
    </clipPath>

    <!-- Efek Cahaya Bulan & Bintang -->
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="starGlow" x="-200%" y="-200%" width="400%" height="400%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <linearGradient id="meteorTail" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="1" />
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0" />
    </linearGradient>

    <!-- Animasi Bintang Kelap-Kelip & Meteor -->
    <style>
      .star-1 { animation: twinkle 3s infinite ease-in-out; }
      .star-2 { animation: twinkle 4.5s infinite ease-in-out 1s; }
      .star-3 { animation: twinkle 2.2s infinite ease-in-out 0.5s; }
      .sparkle { transform-box: fill-box; transform-origin: center; }
      @keyframes twinkle {
        0%, 100% { opacity: 0.25; transform: scale(0.8); }
        50% { opacity: 1; transform: scale(1.3); }
      }
      .meteor {
        stroke: url(#meteorTail);
        stroke-linecap: round;
        stroke-dasharray: 180;
        stroke-dashoffset: 180;
        animation: shoot 7s infinite linear;
      }
      @keyframes shoot {
        0% { stroke-dashoffset: 180; opacity: 1; transform: translateX(0) translateY(0); }
        15% { stroke-dashoffset: -180; opacity: 0; transform: translateX(-260px) translateY(140px); }
        100% { stroke-dashoffset: -180; opacity: 0; }
      }
    </style>
  </defs>

  <!-- Latar Langit Malam -->
  <rect width="1000" height="320" rx="16" fill="url(#nightSky)" />
  <rect width="1000" height="320" rx="16" fill="url(#moonGlow)" />
  <ellipse cx="300" cy="275" rx="360" ry="110" fill="url(#nebula)" />
  <ellipse cx="720" cy="20" rx="300" ry="90" fill="url(#nebula)" opacity="0.6" />

  <!-- Bintang-Bintang Kelap-Kelip -->
  <g fill="#ffffff">
    <g class="star-1">
      <circle cx="120" cy="65" r="1.5" />
      <circle cx="340" cy="85" r="2" />
      <circle cx="580" cy="45" r="1.5" />
      <circle cx="820" cy="75" r="2" />
      <circle cx="210" cy="240" r="1.5" />
      <circle cx="710" cy="230" r="2" />
      <circle cx="920" cy="190" r="1.5" />
    </g>
    <g class="star-2">
      <circle cx="240" cy="40" r="2.5" />
      <circle cx="480" cy="110" r="1.5" />
      <circle cx="750" cy="50" r="2.5" />
      <circle cx="890" cy="100" r="1.5" />
      <circle cx="150" cy="180" r="2" />
      <circle cx="410" cy="260" r="2" />
      <circle cx="850" cy="250" r="2" />
    </g>
    <g class="star-3">
      <circle cx="80" cy="110" r="1" />
      <circle cx="420" cy="40" r="2" />
      <circle cx="640" cy="95" r="1.5" />
      <circle cx="950" cy="60" r="2" />
      <circle cx="320" cy="210" r="1.5" />
      <circle cx="610" cy="255" r="1" />
    </g>
  </g>

  <!-- Bintang Utama Berkilau -->
  <g class="star-2 sparkle" fill="#fff7c2" filter="url(#starGlow)">
    <path d="M265 82 L268 91 L277 94 L268 97 L265 106 L262 97 L253 94 L262 91 Z" />
    <path d="M770 150 L773 159 L782 162 L773 165 L770 174 L767 165 L758 162 L767 159 Z" />
    <path d="M535 235 L537 242 L544 245 L537 248 L535 255 L533 248 L526 245 L533 242 Z" />
  </g>

  <!-- Bintang Berwarna Natural -->
  <g filter="url(#starGlow)">
    <circle cx="375" cy="155" r="1.8" fill="#bfdbfe" />
    <circle cx="625" cy="175" r="1.4" fill="#fde68a" />
    <circle cx="935" cy="145" r="1.6" fill="#ddd6fe" />
    <circle cx="110" cy="275" r="1.2" fill="#bae6fd" />
  </g>

  <!-- Debu Bintang -->
  <g fill="#c4b5fd" opacity="0.7">
    <circle cx="55" cy="210" r="1" />
    <circle cx="180" cy="125" r="1" />
    <circle cx="295" cy="275" r="1" />
    <circle cx="455" cy="65" r="1" />
    <circle cx="690" cy="100" r="1" />
    <circle cx="965" cy="235" r="1" />
  </g>

  <!-- Konstelasi Halus -->
  <g fill="none" stroke="#a5b4fc" stroke-width="0.7" opacity="0.22">
    <path d="M92 110 L150 180 L210 145 L265 94" />
    <path d="M580 45 L640 95 L710 130 L770 162" />
  </g>

  <!-- Bulan Sabit Lembut -->
  <circle cx="872" cy="116" r="78" fill="#fef3c7" opacity="0.05" filter="url(#glow)" />
  <path d="M860,65 C888,65 915,88 915,116 C915,144 892,167 864,167 C850,167 838,161 829,153 C852,146 867,125 867,102 C867,88 860,75 860,65 Z"
        fill="url(#moonSurface)" opacity="0.3" filter="url(#glow)" />
  <g>
    <path d="M860,65 C888,65 915,88 915,116 C915,144 892,167 864,167 C850,167 838,161 829,153 C852,146 867,125 867,102 C867,88 860,75 860,65 Z"
          fill="url(#moonSurface)" opacity="0.98" stroke="#fff9d6" stroke-opacity="0.35" />
    <g clip-path="url(#moonCrescent)" fill="#c99555">
      <circle cx="884" cy="104" r="6" opacity="0.2" />
      <circle cx="873" cy="135" r="4" opacity="0.18" />
      <circle cx="897" cy="128" r="3" opacity="0.16" />
      <circle cx="858" cy="119" r="2.5" opacity="0.16" />
      <circle cx="888" cy="148" r="2" opacity="0.2" />
      <circle cx="906" cy="112" r="2" opacity="0.14" />
    </g>
  </g>

  <!-- Bintang Jatuh (Shooting Star) -->
  <line x1="680" y1="30" x2="520" y2="180" stroke-width="2" class="meteor" />

  <rect x="1" y="1" width="998" height="318" rx="15" fill="none" stroke="#a5b4fc" stroke-opacity="0.18" />
</svg>